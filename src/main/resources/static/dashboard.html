<!DOCTYPE html>
<html>
<head>
    <title>SpendIQ Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            width: 25%;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .form-section {
            text-align: center;
            margin-bottom: 30px;
        }

        input, select {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #00c6ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0072ff;
        }

        table {
            width: 100%;
            background: white;
            color: black;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #0072ff;
            color: white;
        }

        .charts {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }

        canvas {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .logout {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Expense Dashboard</h1>

<div class="cards">
    <div class="card">
        <h3>Total Income</h3>
        <h2 id="totalIncome">₹ 0</h2>
    </div>
    <div class="card">
        <h3>Total Expense</h3>
        <h2 id="totalExpense">₹ 0</h2>
    </div>
    <div class="card">
        <h3>Balance</h3>
        <h2 id="balance">₹ 0</h2>
    </div>
</div>

<div class="form-section">
    <input type="text" id="description" placeholder="Description">
    <input type="text" id="category" placeholder="Category">
    <input type="number" id="amount" placeholder="Amount">

    <select id="type">
        <option value="INCOME">Income</option>
        <option value="EXPENSE">Expense</option>
    </select>

    <button onclick="addTransaction()">Add</button>
</div>

<table>
    <thead>
    <tr>
        <th>Description</th>
        <th>Category</th>
        <th>Amount</th>
        <th>Type</th>
        <th>Date</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody id="transactionTable"></tbody>
</table>

<div class="charts">
    <canvas id="pieChart" width="300" height="300"></canvas>
    <canvas id="barChart" width="400" height="300"></canvas>
</div>

<div class="logout">
    <button onclick="logout()">Logout</button>
</div>

<script>

    async function loadTransactions() {
        const response = await fetch("/api/transactions");
        const data = await response.json();

        const table = document.getElementById("transactionTable");
        table.innerHTML = "";

        let income = 0;
        let expense = 0;
        let categoryMap = {};

        data.forEach(t => {

            if (t.type === "INCOME") income += t.amount;
            else expense += t.amount;

            if (!categoryMap[t.category]) categoryMap[t.category] = 0;
            categoryMap[t.category] += t.amount;

            table.innerHTML += `
            <tr>
                <td>${t.description}</td>
                <td>${t.category}</td>
                <td>₹ ${t.amount}</td>
                <td style="color:${t.type==='INCOME'?'green':'red'}">${t.type}</td>
                <td>${t.date}</td>
                <td><button onclick="deleteTransaction(${t.id})">X</button></td>
            </tr>
        `;
        });

        document.getElementById("totalIncome").innerText = "₹ " + income;
        document.getElementById("totalExpense").innerText = "₹ " + expense;
        document.getElementById("balance").innerText = "₹ " + (income - expense);

        loadCharts(income, expense, categoryMap);
    }

    async function addTransaction() {

        const transaction = {
            description: document.getElementById("description").value,
            category: document.getElementById("category").value,
            amount: document.getElementById("amount").value,
            type: document.getElementById("type").value
        };

        await fetch("/api/transactions", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(transaction)
        });

        loadTransactions();
    }

    async function deleteTransaction(id) {
        await fetch("/api/transactions/" + id, { method: "DELETE" });
        loadTransactions();
    }

    function logout() {
        fetch("/api/auth/logout")
            .then(() => window.location.href = "login.html");
    }

    function loadCharts(income, expense, categoryMap) {

        new Chart(document.getElementById("pieChart"), {
            type: "pie",
            data: {
                labels: ["Income", "Expense"],
                datasets: [{
                    data: [income, expense],
                    backgroundColor: ["green", "red"]
                }]
            }
        });

        new Chart(document.getElementById("barChart"), {
            type: "bar",
            data: {
                labels: Object.keys(categoryMap),
                datasets: [{
                    label: "Category Wise Amount",
                    data: Object.values(categoryMap),
                    backgroundColor: "blue"
                }]
            }
        });
    }

    loadTransactions();

</script>

</body>
</html>
