<!DOCTYPE html>
<html>
<head>
    <title>Login - SpendIQ</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#141E30,#243B55);
            font-family: Arial;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            width: 320px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            border: none;
            background: #00c6ff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0072ff;
            color: white;
        }

        a {
            color: #00c6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>SpendIQ Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <br><br>
    <a href="register.html">Create Account</a>
</div>

<script>
    function login() {
        fetch('/api/auth/login', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                username:username.value,
                password:password.value
            })
        })
            .then(res=>res.text())
            .then(data=>{
                if(data.includes("successful")){
                    window.location.href="dashboard.html";
                } else {
                    alert(data);
                }
            });
    }
</script>

</body>
</html>
