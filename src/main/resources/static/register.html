<!DOCTYPE html>
<html>
<head>
    <title>Register - SpendIQ</title>
</head>

<body style="margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#141E30,#243B55);font-family:Arial;">

<div style="background:rgba(255,255,255,0.1);padding:40px;border-radius:20px;backdrop-filter:blur(15px);width:320px;text-align:center;color:white;box-shadow:0 10px 30px rgba(0,0,0,0.5);">

    <h2>Create Account</h2>

    <input type="text" id="username" placeholder="Username" style="width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;">
    <input type="email" id="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;">
    <input type="password" id="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;">

    <button onclick="register()" style="width:100%;padding:12px;margin-top:15px;border-radius:10px;border:none;background:#00c6ff;font-weight:bold;cursor:pointer;">
        Register
    </button>

    <br><br>
    <a href="login.html" style="color:#00c6ff;">Back to Login</a>

</div>

<script>
    function register() {
        fetch('/api/auth/register',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                username:username.value,
                email:email.value,
                password:password.value
            })
        })
            .then(res=>res.text())
            .then(data=>{
                alert(data);
                if(data.includes("success")){
                    window.location.href="login.html";
                }
            });
    }
</script>

</body>
</html>
